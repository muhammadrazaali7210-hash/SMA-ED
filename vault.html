<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault & Cipher</title>
    <style>
        :root {
            --bg: #000000;
            --card-bg: #0a0a0a;
            --border: #222222;
            --text-main: #ffffff;
            --text-muted: #888888;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            position: relative;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .nav-tabs {
            display: flex;
            background: #111111;
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #000000;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        textarea, input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: #111111;
            color: #ffffff;
            outline: none;
            resize: vertical;
            min-height: 90px;
            transition: border-color 0.2s ease;
        }

        textarea:focus, input[type="password"]:focus {
            border-color: #ffffff;
        }

        .file-upload-box {
            border: 1px dashed var(--border);
            padding: 16px;
            border-radius: 8px;
            background: #111111;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        .file-upload-box:hover {
            border-color: #ffffff;
        }

        .file-upload-box input {
            display: none;
        }

        .file-upload-label {
            font-size: 0.85rem;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
        }

        .file-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s ease;
            margin-top: 8px;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        .output-box {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: none;
        }

        .output-box.visible {
            display: block;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-secondary {
            flex: 1;
            padding: 10px;
            background: #111111;
            color: #ffffff;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secondary:hover {
            background: #222222;
        }

        .recovered-text {
            background: #111111;
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            white-space: pre-wrap;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .file-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .file-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #111111;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .file-actions {
            display: flex;
            gap: 6px;
        }

        .file-card a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 4px 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: #1c1c1e;
        }

        .file-card a:hover {
            background: #333333;
        }

        #toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1c1c1e;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            pointer-events: none;
        }
        #toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Vault & Cipher</h1>
            <p>Secure AES-GCM Encrypted Vault</p>
        </header>

        <div class="nav-tabs">
            <button id="btnTabEncode" class="tab-btn active" onclick="switchView('encode')">Encode</button>
            <button id="btnTabDecode" class="tab-btn" onclick="switchView('decode')">Decode</button>
        </div>

        <!-- ENCODE VIEW -->
        <div id="viewEncode">
            <div class="form-group">
                <label>Secret Message</label>
                <textarea id="encodeText" placeholder="Enter text message..."></textarea>
            </div>

            <div class="form-group">
                <label>Attach Media / Files</label>
                <div class="file-upload-box" onclick="document.getElementById('fileInput').click()">
                    <span class="file-upload-label">Choose Files</span>
                    <input type="file" id="fileInput" multiple>
                    <div id="fileStatus" class="file-status">No attachments selected</div>
                </div>
            </div>

            <div class="form-group">
                <label>Passphrase</label>
                <input type="password" id="encodePass" placeholder="Enter secret password">
            </div>

            <button class="action-btn" onclick="processEncode()">Generate Secure Package</button>

            <div id="encodeOutput" class="output-box">
                <label>Result Package</label>
                <textarea id="resultCode" readonly style="font-family: monospace; font-size: 0.8rem;"></textarea>
                <div class="btn-group">
                    <button class="btn-secondary" onclick="copyResult()">Copy Code</button>
                    <button class="btn-secondary" onclick="downloadResult()">Download File</button>
                </div>
            </div>
        </div>

        <!-- DECODE VIEW -->
        <div id="viewDecode" style="display: none;">
            <div class="form-group">
                <label>Paste Secure Package</label>
                <textarea id="decodeInput" placeholder="Paste package code here..." style="font-family: monospace; font-size: 0.8rem;"></textarea>
            </div>

            <div class="form-group">
                <label>Passphrase</label>
                <input type="password" id="decodePass" placeholder="Enter password">
            </div>

            <button class="action-btn" onclick="processDecode()">Decode Package</button>

            <div id="decodeOutput" class="output-box">
                <label>Decoded Message</label>
                <div id="decodedText" class="recovered-text"></div>
                
                <label>Attached Files</label>
                <div id="decodedFiles" class="file-grid"></div>
            </div>
        </div>
    </div>

    <div id="toast">Notification</div>

    <script>
        let attachedFiles = [];

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function switchView(mode) {
            const encodeView = document.getElementById('viewEncode');
            const decodeView = document.getElementById('viewDecode');
            const btnTabEncode = document.getElementById('btnTabEncode');
            const btnTabDecode = document.getElementById('btnTabDecode');

            if (mode === 'encode') {
                encodeView.style.display = 'block';
                decodeView.style.display = 'none';
                btnTabEncode.classList.add('active');
                btnTabDecode.classList.remove('active');
            } else {
                encodeView.style.display = 'none';
                decodeView.style.display = 'block';
                btnTabDecode.classList.add('active');
                btnTabEncode.classList.remove('active');
            }
        }

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            attachedFiles = [];
            for (let file of files) {
                try {
                    const buffer = await file.arrayBuffer();
                    const byteArray = Array.from(new Uint8Array(buffer));
                    attachedFiles.push({
                        name: file.name,
                        type: file.type || 'application/octet-stream',
                        data: byteArray
                    });
                } catch (err) {
                    console.error("File loading error:", err);
                }
            }
            document.getElementById('fileStatus').innerText = attachedFiles.length > 0 ? `${attachedFiles.length} file(s) attached safely` : 'No attachments selected';
        });

        async function deriveKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]);
            return window.crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
        }

        async function processEncode() {
            const text = document.getElementById('encodeText').value;
            const pass = document.getElementById('encodePass').value;

            if (!pass) { showToast('Please enter a passphrase.'); return; }

            try {
                const payload = JSON.stringify({ message: text, files: attachedFiles });
                const payloadBytes = new TextEncoder().encode(payload);

                const salt = window.crypto.getRandomValues(new Uint8Array(16));
                const iv = window.crypto.getRandomValues(new Uint8Array(12));
                const key = await deriveKey(pass, salt);

                const encryptedBuffer = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, payloadBytes);

                const combined = new Uint8Array(salt.length + iv.length + encryptedBuffer.byteLength);
                combined.set(salt, 0);
                combined.set(iv, salt.length);
                combined.set(new Uint8Array(encryptedBuffer), salt.length + iv.length);

                let binaryStr = "";
                const chunkSize = 0x8000;
                for (let i = 0; i < combined.length; i += chunkSize) {
                    const chunk = combined.subarray(i, i + chunkSize);
                    binaryStr += String.fromCharCode.apply(null, chunk);
                }
                const finalCipher = btoa(binaryStr);

                document.getElementById('resultCode').value = finalCipher;
                document.getElementById('encodeOutput').classList.add('visible');
                showToast('Secure package generated.');
            } catch (err) {
                showToast('Encoding failed. File might be too large.');
                console.error(err);
            }
        }

        async function processDecode() {
            const raw = document.getElementById('decodeInput').value.trim();
            const pass = document.getElementById('decodePass').value;

            if (!pass || !raw) { showToast('Enter code and password.'); return; }

            try {
                const binaryString = atob(raw);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                const salt = bytes.slice(0, 16);
                const iv = bytes.slice(16, 28);
                const data = bytes.slice(28);

                const key = await deriveKey(pass, salt);
                const decryptedBuffer = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
                
                const payloadJSON = new TextDecoder().decode(decryptedBuffer);
                const result = JSON.parse(payloadJSON);

                document.getElementById('decodedText').innerText = result.message || 'No text content.';
                
                const filesContainer = document.getElementById('decodedFiles');
                filesContainer.innerHTML = '';

                if (result.files && result.files.length > 0) {
                    result.files.forEach(file => {
                        const uint8 = new Uint8Array(file.data);
                        const blob = new Blob([uint8], { type: file.type });
                        const url = URL.createObjectURL(blob);

                        const item = document.createElement('div');
                        item.className = 'file-card';
                        item.innerHTML = `
                            <span>${file.name}</span>
                            <div class="file-actions">
                                <a href="${url}" target="_blank">View</a>
                                <a href="${url}" download="${file.name}">Save</a>
                            </div>
                        `;
                        filesContainer.appendChild(item);
                    });
                } else {
                    filesContainer.innerHTML = '<span style="font-size: 0.75rem; color: #888888;">No attachments found.</span>';
                }

                document.getElementById('decodeOutput').classList.add('visible');
                showToast('Decryption successful.');
            } catch (err) {
                showToast('Invalid password or corrupted package!');
                console.error(err);
            }
        }

        function copyResult() {
            const el = document.getElementById('resultCode');
            el.select();
            document.execCommand('copy');
            showToast('Copied to clipboard');
        }

        function downloadResult() {
            const code = document.getElementById('resultCode').value;
            const blob = new Blob([code], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'vault_package.txt';
            link.click();
            showToast('File downloaded.');
        }
    </script>
</body>
</html>
